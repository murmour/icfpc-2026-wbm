[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "littleman-flow"
version = "0.1.0"
description = "Dataflow-oriented Littleman translator experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
littleman-flow = "flow.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flow*"]

